[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altalpha"
version = "0.7.0"
description = "Alternative-data quantitative research terminal"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JB"}]
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "requests==2.32.4",
  "beautifulsoup4==4.13.4",
  "lxml==6.0.0",
  "pandas==2.3.1",
  "numpy==2.3.2",
  "python-dateutil==2.9.0.post0",
  "typer==0.16.0",
  "rich==14.1.0",
  "PyYAML==6.0.2",
  "scipy==1.16.1",
  "psycopg[binary]==3.2.9",
  "alembic==1.16.4",
  "APScheduler==3.11.0",
  "scikit-learn==1.7.1",
  "statsmodels==0.14.5",
  "pytest==8.4.1"
]

[project.scripts]
altalpha = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]
