<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#071018"/><rect width="1440" height="60" fill="#09141d"/><text x="30" y="38" font-family="Arial" font-size="24" font-weight="700" fill="#dbe7ee">ALT<tspan fill="#36d58b">ALPHA</tspan></text><text x="30" y="150" font-family="Arial" font-size="28" font-weight="700" fill="#dbe7ee">Risk &amp; Statistical Validation</text><text x="30" y="180" font-family="Arial" font-size="14" fill="#78909f">Factor decomposition, constrained optimization and anti-overfitting controls.</text><g font-family="Arial"><rect x="30" y="220" width="320" height="110" fill="#0a1720" stroke="#203744"/><text x="50" y="250" font-size="12" fill="#78909f">FACTOR MODEL</text><text x="50" y="295" font-size="28" fill="#dbe7ee">PCA</text><rect x="370" y="220" width="320" height="110" fill="#0a1720" stroke="#203744"/><text x="390" y="250" font-size="12" fill="#78909f">OPTIMIZER</text><text x="390" y="295" font-size="28" fill="#dbe7ee">SLSQP</text><rect x="710" y="220" width="320" height="110" fill="#0a1720" stroke="#203744"/><text x="730" y="250" font-size="12" fill="#78909f">VALIDATION</text><text x="730" y="295" font-size="28" fill="#dbe7ee">DSR / PSR</text><rect x="1050" y="220" width="320" height="110" fill="#0a1720" stroke="#203744"/><text x="1070" y="250" font-size="12" fill="#78909f">CROSS VALIDATION</text><text x="1070" y="295" font-size="28" fill="#dbe7ee">PURGED</text></g><rect x="30" y="380" width="650" height="340" fill="#09151e" stroke="#203744"/><text x="50" y="420" font-family="Arial" font-size="15" fill="#8fa7b6">Statistical validation</text><text x="60" y="480" font-family="Arial" font-size="14" fill="#dbe7ee">Probabilistic Sharpe</text><text x="520" y="480" font-family="Arial" font-size="20" fill="#36d58b">92.4%</text><text x="60" y="540" font-family="Arial" font-size="14" fill="#dbe7ee">Deflated Sharpe</text><text x="520" y="540" font-family="Arial" font-size="20" fill="#36d58b">81.7%</text><text x="60" y="600" font-family="Arial" font-size="14" fill="#dbe7ee">Bootstrap Sharpe 95%</text><text x="500" y="600" font-family="Arial" font-size="20" fill="#dbe7ee">0.58 → 1.67</text><rect x="710" y="380" width="700" height="340" fill="#09151e" stroke="#203744"/><text x="730" y="420" font-family="Arial" font-size="15" fill="#8fa7b6">Research pipeline</text><g font-family="Arial" font-size="14" fill="#dbe7ee"><text x="750" y="480">PIT data → Signals → Risk model</text><text x="750" y="540">Optimizer → Costs → Portfolio</text><text x="750" y="600">Walk-forward → Purged CV → DSR</text></g></svg>